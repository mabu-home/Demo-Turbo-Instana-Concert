apiVersion: v1
kind: Secret
metadata:
  name: concert-credentials
  namespace: demo-turbo-instana-concert
type: Opaque
stringData:
  # Replace these values with your actual Concert credentials
  url: "https://91431.us-south-8.concert.saas.ibm.com"
  api-key: "your-concert-api-key-here"
  instance-id: "your-concert-instance-id-here"

---
# Example: How to create this secret from command line
# kubectl create secret generic concert-credentials \
#   --from-literal=url="https://91431.us-south-8.concert.saas.ibm.com" \
#   --from-literal=api-key="your-api-key" \
#   --from-literal=instance-id="your-instance-id" \
#   -n demo-turbo-instana-concert

