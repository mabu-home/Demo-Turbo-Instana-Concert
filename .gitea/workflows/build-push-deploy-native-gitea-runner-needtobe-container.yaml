name: Build, Push and Deploy (Native)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-push-deploy-native:
    runs-on: ubuntu-latest
    env:
      WORKSPACE_DIR: ${{ github.workspace }}
    steps:
      # Step 0: Validate Required Secrets
      - name: Validate Required Secrets
        run: |
          echo "Validating required Gitea secrets..."
          MISSING_SECRETS=""
          
          # Check required secrets
          if [ -z "${{ secrets.GIT_REGISTRY }}" ]; then
            echo "❌ Missing secret: GIT_REGISTRY"
            MISSING_SECRETS="${MISSING_SECRETS}GIT_REGISTRY "
          else
            echo "✓ GIT_REGISTRY is set"
          fi
          
          if [ -z "${{ secrets.GIT_USERNAME }}" ]; then
            echo "❌ Missing secret: GIT_USERNAME"
            MISSING_SECRETS="${MISSING_SECRETS}GIT_USERNAME "
          else
            echo "✓ GIT_USERNAME is set"
          fi
          
          if [ -z "${{ secrets.GIT_TOKEN }}" ]; then
            echo "❌ Missing secret: GIT_TOKEN"
            MISSING_SECRETS="${MISSING_SECRETS}GIT_TOKEN "
          else
            echo "✓ GIT_TOKEN is set"
          fi
          
          if [ -z "${{ secrets.KUBECONFIG }}" ]; then
            echo "❌ Missing secret: KUBECONFIG"
            MISSING_SECRETS="${MISSING_SECRETS}KUBECONFIG "
          else
            echo "✓ KUBECONFIG is set"
          fi
          
          if [ -z "${{ secrets.INGRESS_HOST }}" ]; then
            echo "❌ Missing secret: INGRESS_HOST"
            MISSING_SECRETS="${MISSING_SECRETS}INGRESS_HOST "
          else
            echo "✓ INGRESS_HOST is set: ${{ secrets.INGRESS_HOST }}"
          fi
          
          # Check optional Concert secrets
          if [ -n "${{ secrets.CONCERT_URL }}" ]; then
            echo "✓ CONCERT_URL is set (Concert integration enabled)"
            if [ -z "${{ secrets.CONCERT_API_KEY }}" ]; then
              echo "⚠️  Warning: CONCERT_URL set but CONCERT_API_KEY missing"
            fi
            if [ -z "${{ secrets.CONCERT_INSTANCE_ID }}" ]; then
              echo "⚠️  Warning: CONCERT_URL set but CONCERT_INSTANCE_ID missing"
            fi
          else
            echo "ℹ️  CONCERT_URL not set (Concert integration disabled)"
          fi
          
          # Fail if required secrets are missing
          if [ -n "$MISSING_SECRETS" ]; then
            echo ""
            echo "============================================"
            echo "❌ WORKFLOW FAILED: Missing Required Secrets"
            echo "============================================"
            echo ""
            echo "Missing secrets: ${MISSING_SECRETS}"
            echo ""
            echo "Please add these secrets in Gitea:"
            echo "  Repository → Settings → Secrets → Actions"
            echo ""
            echo "Required secrets:"
            echo "  - GIT_REGISTRY: Registry URL (e.g., almabuild2.lab.allwaysbeginner.com:5000)"
            echo "  - GIT_USERNAME: Registry username"
            echo "  - GIT_TOKEN: Registry password/token"
            echo "  - KUBECONFIG: Kubernetes config (base64 encoded or plain text)"
            echo "  - INGRESS_HOST: Hostname for ingress (e.g., hello-world-python.lab.allwaysbeginner.com)"
            echo ""
            echo "Optional Concert secrets:"
            echo "  - CONCERT_URL: Concert instance URL"
            echo "  - CONCERT_API_KEY: Concert API key"
            echo "  - CONCERT_INSTANCE_ID: Concert instance ID"
            echo ""
            echo "Example values:"
            echo "  GIT_REGISTRY=almabuild2.lab.allwaysbeginner.com:5000"
            echo "  GIT_USERNAME=gitea-user"
            echo "  GIT_TOKEN=your-gitea-token"
            echo "  INGRESS_HOST=hello-world-python.lab.allwaysbeginner.com"
            echo "  KUBECONFIG=<base64-encoded-kubeconfig>"
            echo ""
            exit 1
          fi
          
          echo ""
          echo "✅ All required secrets are configured"
          echo "============================================"

      # Step 1: Checkout code
      - name: Checkout code
        run: |
          echo "Checking out code..."
          echo "Working directory: $(pwd)"
          
          # Check if code is already present
          if [ -d "java-app" ] && [ -d "python-app" ]; then
            echo "✓ Code already checked out"
            ls -la
          else
            echo "Code not found, cloning repository..."
            
            # Extract host from GIT_REGISTRY (remove port if present)
            GITEA_HOST=$(echo "${{ secrets.GIT_REGISTRY }}" | cut -d':' -f1)
            GITEA_PORT=$(echo "${{ secrets.GIT_REGISTRY }}" | cut -d':' -f2)
            
            # Construct Gitea URL
            GITEA_URL="http://${GITEA_HOST}:${GITEA_PORT}"
            
            echo "Cloning from: ${GITEA_URL}/${{ gitea.repository }}.git"
            
            # Clone the repository
            git clone "${GITEA_URL}/${{ gitea.repository }}.git" repo
            cd repo
            git checkout ${{ gitea.ref_name }} || git checkout ${{ gitea.sha }} || true
            
            # Move contents to workspace
            shopt -s dotglob
            mv * ../ 2>/dev/null || true
            cd ..
            rm -rf repo
            
            echo "✓ Repository cloned"
            ls -la
          fi

      # Step 2: Install Docker
      - name: Install Docker
        run: |
          echo "Installing Docker..."
          
          # Detect if we have sudo or running as root
          if command -v sudo &> /dev/null; then
            SUDO="sudo"
          elif [ "$(id -u)" -eq 0 ]; then
            SUDO=""
            echo "Running as root, sudo not needed"
          else
            SUDO=""
            echo "⚠️  Warning: No sudo available and not running as root"
          fi
          
          # Check if Docker is already installed
          if command -v docker &> /dev/null; then
            echo "✓ Docker is already installed"
            docker --version
          else
            echo "Installing Docker from official repository..."
            
            # Detect package manager
            if command -v yum &> /dev/null; then
              PKG_MGR="yum"
            elif command -v apt-get &> /dev/null; then
              PKG_MGR="apt-get"
            elif command -v apk &> /dev/null; then
              PKG_MGR="apk"
            else
              echo "❌ No supported package manager found (yum, apt-get, apk)"
              exit 1
            fi
            
            echo "Using package manager: $PKG_MGR"
            
            # Install based on package manager
            if [ "$PKG_MGR" = "yum" ]; then
              # RHEL/CentOS/AlmaLinux
              $SUDO yum install -y yum-utils device-mapper-persistent-data lvm2
              $SUDO yum-config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
              $SUDO yum install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              
            elif [ "$PKG_MGR" = "apt-get" ]; then
              # Debian/Ubuntu - detect which one
              if [ -f /etc/os-release ]; then
                . /etc/os-release
                OS_ID="$ID"
              else
                OS_ID="ubuntu"
              fi
              
              echo "Detected OS: $OS_ID"
              
              # Install prerequisites
              $SUDO apt-get update
              $SUDO apt-get install -y ca-certificates curl gnupg lsb-release
              
              # Create keyrings directory
              $SUDO install -m 0755 -d /etc/apt/keyrings
              
              # Add Docker's official GPG key and repository based on OS
              if [ "$OS_ID" = "debian" ]; then
                # Debian
                curl -fsSL https://download.docker.com/linux/debian/gpg | $SUDO gpg --dearmor -o /etc/apt/keyrings/docker.gpg
                $SUDO chmod a+r /etc/apt/keyrings/docker.gpg
                echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | $SUDO tee /etc/apt/sources.list.d/docker.list > /dev/null
              else
                # Ubuntu
                curl -fsSL https://download.docker.com/linux/ubuntu/gpg | $SUDO gpg --dearmor -o /etc/apt/keyrings/docker.gpg
                $SUDO chmod a+r /etc/apt/keyrings/docker.gpg
                echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | $SUDO tee /etc/apt/sources.list.d/docker.list > /dev/null
              fi
              
              # Update and install Docker
              $SUDO apt-get update
              $SUDO apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              
            elif [ "$PKG_MGR" = "apk" ]; then
              # Alpine Linux
              $SUDO apk add --no-cache docker docker-cli docker-compose
            fi
            
            # Start Docker service (if systemctl available)
            if command -v systemctl &> /dev/null; then
              $SUDO systemctl start docker 2>/dev/null || true
              $SUDO systemctl enable docker 2>/dev/null || true
            fi
            
            # Start Docker daemon if not running (for non-systemd systems)
            if ! pgrep dockerd > /dev/null; then
              if [ -z "$SUDO" ]; then
                dockerd > /dev/null 2>&1 &
              else
                $SUDO dockerd > /dev/null 2>&1 &
              fi
              sleep 3
            fi
            
            # Add current user to docker group (if not root)
            if [ "$(id -u)" -ne 0 ] && [ -n "$SUDO" ]; then
              $SUDO usermod -aG docker $(whoami) 2>/dev/null || true
            fi
            
            # Verify installation
            docker --version
            echo "✓ Docker installed successfully"
          fi
          
          # Ensure Docker socket permissions
          if [ -S /var/run/docker.sock ]; then
            $SUDO chmod 666 /var/run/docker.sock 2>/dev/null || chmod 666 /var/run/docker.sock 2>/dev/null || true
          fi
          
          # Test Docker
          docker info
          echo "✓ Docker is working"

      # Step 3: Run Semgrep SAST Scan
      - name: Run Semgrep SAST Scan
        continue-on-error: true
        run: |
          echo "============================================"
          echo "Running Semgrep SAST Security Scan"
          echo "============================================"
          echo "Application: demo-turbo-instana-concert"
          echo "Workspace: $WORKSPACE_DIR"
          echo ""
          
          # Create output directory
          mkdir -p "$WORKSPACE_DIR"
          
          # Check if pip3 is available
          SEMGREP_INSTALLED=false
          if command -v pip3 &> /dev/null; then
            echo "Attempting to install Semgrep with pip3..."
            if pip3 install semgrep 2>/dev/null; then
              echo "✓ Semgrep installed successfully"
              SEMGREP_INSTALLED=true
            elif pip3 install --user semgrep 2>/dev/null; then
              echo "✓ Semgrep installed to user directory"
              export PATH="$HOME/.local/bin:$PATH"
              SEMGREP_INSTALLED=true
            else
              echo "⚠️  Failed to install Semgrep with pip3"
            fi
          else
            echo "⚠️  pip3 not available"
          fi
          
          # Verify Semgrep is available
          if command -v semgrep &> /dev/null; then
            echo "✓ Using native Semgrep: $(semgrep --version | head -n1)"
            SEMGREP_INSTALLED=true
          elif [ "$SEMGREP_INSTALLED" = false ]; then
            echo "⚠️  Native Semgrep not available, will use Docker-based Semgrep"
          fi
          
          # Verify scan targets exist
          echo ""
          echo "Verifying scan targets..."
          if [ ! -d "java-app" ]; then
            echo "⚠️  java-app/ directory not found"
          else
            echo "✓ java-app/ directory found"
          fi
          
          if [ ! -d "python-app" ]; then
            echo "⚠️  python-app/ directory not found"
          else
            echo "✓ python-app/ directory found"
          fi
          
          if [ ! -d "java-app" ] && [ ! -d "python-app" ]; then
            echo "❌ No scan targets found, skipping Semgrep scan"
            exit 0
          fi
          
          # Run Semgrep scan
          echo ""
          echo "Starting Semgrep scan..."
          echo ""
          
          SCAN_SUCCESS=false
          
          if command -v semgrep &> /dev/null; then
            # Native Semgrep
            echo "Using native Semgrep..."
            echo ""
            
            # Note: Semgrep exit code 2 means findings were found (not an error)
            # Exit codes: 0 = no findings, 1 = error, 2 = findings found
            
            # Run SARIF scan
            echo "Generating SARIF output..."
            semgrep --config=auto \
              --sarif \
              --output="$WORKSPACE_DIR/semgrep-results.sarif" \
              java-app/ python-app/ 2>&1 || EXIT_CODE=$?
            
            # Check exit code (0 or 2 are success, 1 is error)
            if [ -z "$EXIT_CODE" ] || [ "$EXIT_CODE" = "0" ] || [ "$EXIT_CODE" = "2" ]; then
              echo "✓ SARIF scan completed (exit code: ${EXIT_CODE:-0})"
              SCAN_SUCCESS=true
            else
              echo "⚠️  SARIF scan failed with exit code $EXIT_CODE"
            fi
            
            # Run JSON scan for summary
            echo ""
            echo "Generating JSON output..."
            unset EXIT_CODE
            semgrep --config=auto \
              --json \
              --output="$WORKSPACE_DIR/semgrep-results.json" \
              java-app/ python-app/ 2>&1 || EXIT_CODE=$?
            
            # Check exit code (0 or 2 are success, 1 is error)
            if [ -z "$EXIT_CODE" ] || [ "$EXIT_CODE" = "0" ] || [ "$EXIT_CODE" = "2" ]; then
              echo "✓ JSON scan completed (exit code: ${EXIT_CODE:-0})"
              SCAN_SUCCESS=true
            else
              echo "⚠️  JSON scan failed with exit code $EXIT_CODE"
            fi
          else
            # Docker-based Semgrep
            echo "Using Docker-based Semgrep..."
            echo "Current directory: $(pwd)"
            echo ""
            
            # Note: Semgrep exit code 2 means findings were found (not an error)
            # Exit codes: 0 = no findings, 1 = error, 2 = findings found
            
            # Run SARIF scan - capture output to stdout and save to file
            echo "Generating SARIF output..."
            echo "Debug: Current directory permissions: $(ls -ld $(pwd))"
            echo "Debug: Current user: $(whoami)"
            echo "Debug: Current user ID: $(id -u)"
            
            # Try to write directly to stdout and capture
            SARIF_OUTPUT=$(docker run --rm \
              -v "$(pwd):/src" \
              -w /src \
              returntocorp/semgrep:latest \
              semgrep --config=auto \
              --sarif \
              java-app/ python-app/ 2>&1) || EXIT_CODE=$?
            
            # Check exit code (0 or 2 are success, 1 is error)
            if [ -z "$EXIT_CODE" ] || [ "$EXIT_CODE" = "0" ] || [ "$EXIT_CODE" = "2" ]; then
              echo "✓ SARIF scan completed (exit code: ${EXIT_CODE:-0})"
              SCAN_SUCCESS=true
              
              # Save output to file
              echo "$SARIF_OUTPUT" > semgrep-results.sarif
              echo "✓ SARIF output saved to file"
              ls -lh semgrep-results.sarif
            else
              echo "⚠️  SARIF scan failed with exit code $EXIT_CODE"
              echo "Output: $SARIF_OUTPUT"
            fi
            
            # Run JSON scan - capture output to stdout and save to file
            echo ""
            echo "Generating JSON output..."
            unset EXIT_CODE
            
            JSON_OUTPUT=$(docker run --rm \
              -v "$(pwd):/src" \
              -w /src \
              returntocorp/semgrep:latest \
              semgrep --config=auto \
              --json \
              java-app/ python-app/ 2>&1) || EXIT_CODE=$?
            
            # Check exit code (0 or 2 are success, 1 is error)
            if [ -z "$EXIT_CODE" ] || [ "$EXIT_CODE" = "0" ] || [ "$EXIT_CODE" = "2" ]; then
              echo "✓ JSON scan completed (exit code: ${EXIT_CODE:-0})"
              SCAN_SUCCESS=true
              
              # Save output to file
              echo "$JSON_OUTPUT" > semgrep-results.json
              echo "✓ JSON output saved to file"
              ls -lh semgrep-results.json
            else
              echo "⚠️  JSON scan failed with exit code $EXIT_CODE"
              echo "Output: $JSON_OUTPUT"
            fi
          fi
          
          # Verify files were created
          echo ""
          echo "Verifying generated files..."
          
          SARIF_EXISTS=false
          JSON_EXISTS=false
          
          if [ -f "$WORKSPACE_DIR/semgrep-results.sarif" ]; then
            echo "✓ SARIF file created: $(ls -lh "$WORKSPACE_DIR/semgrep-results.sarif")"
            SARIF_EXISTS=true
          elif [ -f "semgrep-results.sarif" ]; then
            echo "✓ SARIF file created in current directory: $(ls -lh semgrep-results.sarif)"
            cp semgrep-results.sarif "$WORKSPACE_DIR/" 2>/dev/null || true
            SARIF_EXISTS=true
          else
            echo "⚠️  SARIF file not found"
          fi
          
          if [ -f "$WORKSPACE_DIR/semgrep-results.json" ]; then
            echo "✓ JSON file created: $(ls -lh "$WORKSPACE_DIR/semgrep-results.json")"
            JSON_EXISTS=true
          elif [ -f "semgrep-results.json" ]; then
            echo "✓ JSON file created in current directory: $(ls -lh semgrep-results.json)"
            cp semgrep-results.json "$WORKSPACE_DIR/" 2>/dev/null || true
            JSON_EXISTS=true
          else
            echo "⚠️  JSON file not found"
          fi
          
          # Show summary if results exist
          if [ "$JSON_EXISTS" = true ]; then
            JSON_FILE="$WORKSPACE_DIR/semgrep-results.json"
            [ ! -f "$JSON_FILE" ] && JSON_FILE="semgrep-results.json"
            
            if [ -f "$JSON_FILE" ]; then
              echo ""
              echo "Scan Results Summary:"
              echo "--------------------"
              
              # Count total findings
              if command -v python3 &> /dev/null; then
                TOTAL_FINDINGS=$(python3 -c "import json; data=json.load(open('$JSON_FILE')); print(len(data.get('results', [])))" 2>/dev/null || echo "0")
                echo "Total findings: ${TOTAL_FINDINGS}"
                
                # Count by severity
                echo "By severity:"
                python3 -c "
                import json
                try:
                    with open('$JSON_FILE') as f:
                        data = json.load(f)
                    results = data.get('results', [])
                    counts = {}
                    for result in results:
                        severity = result.get('extra', {}).get('severity', 'UNKNOWN')
                        counts[severity] = counts.get(severity, 0) + 1
                    for k, v in sorted(counts.items()):
                        print(f'  {k}: {v}')
                except Exception as e:
                    print(f'  Error parsing results: {e}')
                " 2>/dev/null || echo "  Could not parse severity data"
              else
                echo "  Python3 not available for summary parsing"
              fi
            fi
          fi
          
          echo ""
          if [ "$SARIF_EXISTS" = true ] || [ "$JSON_EXISTS" = true ]; then
            echo "✓ Semgrep SAST scan completed successfully"
          else
            echo "⚠️  Semgrep scan completed but no output files generated"
            echo "This is non-blocking, workflow will continue..."
          fi
          echo "============================================"

      # Step 4: Upload Semgrep Results to Concert
      - name: Upload Semgrep Results to Concert
        if: secrets.CONCERT_URL != ''
        continue-on-error: true
        env:
          CONCERT_URL: ${{ secrets.CONCERT_URL }}
          CONCERT_API_KEY: ${{ secrets.CONCERT_API_KEY }}
          CONCERT_INSTANCE_ID: ${{ secrets.CONCERT_INSTANCE_ID }}
        run: |
          echo "============================================"
          echo "Uploading Semgrep SAST Results to Concert"
          echo "============================================"
          echo "Application: demo-turbo-instana-concert"
          echo "Concert URL: ${CONCERT_URL}"
          echo ""
          
          # Check for SARIF file in multiple locations
          SARIF_FILE=""
          
          if [ -f "$WORKSPACE_DIR/semgrep-results.sarif" ]; then
            SARIF_FILE="$WORKSPACE_DIR/semgrep-results.sarif"
            echo "✓ Found SARIF file in workspace: $SARIF_FILE"
          elif [ -f "semgrep-results.sarif" ]; then
            SARIF_FILE="semgrep-results.sarif"
            echo "✓ Found SARIF file in current directory: $SARIF_FILE"
          else
            echo "⚠️  No SARIF results file found in any location"
            echo "Checked locations:"
            echo "  - $WORKSPACE_DIR/semgrep-results.sarif"
            echo "  - ./semgrep-results.sarif"
            echo ""
            echo "This may indicate Semgrep scan failed or was skipped."
            echo "Skipping upload (non-blocking)..."
            exit 0
          fi
          
          # Verify SARIF file is valid JSON
          echo ""
          echo "Validating SARIF file..."
          if command -v jq &> /dev/null; then
            if jq empty "$SARIF_FILE" 2>/dev/null; then
              echo "✓ SARIF file is valid JSON"
              
              # Show file size
              FILE_SIZE=$(ls -lh "$SARIF_FILE" | awk '{print $5}')
              echo "  File size: $FILE_SIZE"
              
              # Count results if possible
              RESULT_COUNT=$(jq '[.runs[]?.results[]?] | length' "$SARIF_FILE" 2>/dev/null || echo "unknown")
              echo "  Results count: $RESULT_COUNT"
            else
              echo "⚠️  SARIF file is not valid JSON, skipping upload"
              exit 0
            fi
          else
            echo "⚠️  jq not available, skipping validation"
          fi
          
          # Upload SARIF results to Concert using Ingestion API
          echo ""
          echo "Uploading SAST results to Concert..."
          echo "Using Concert Ingestion API: ${CONCERT_URL}/ingestion/api/v1/upload_files"
          
          # Concert API only accepts specific file extensions (csv, json, xlsx, xls, yaml, xml)
          # SARIF is JSON format, so copy to .json extension for upload
          SARIF_JSON="${SARIF_FILE%.sarif}.json"
          cp "$SARIF_FILE" "$SARIF_JSON"
          echo "File: ${SARIF_JSON} (SARIF format)"
          
          # Get repository info from Gitea context
          REPO_URL="${{ gitea.server_url }}/${{ gitea.repository }}"
          REPO_NAME="${{ gitea.repository }}"
          
          # Use silent mode and only capture HTTP code (no progress output)
          # Use data_type=static_code_scan (correct type for SAST scans)
          HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/concert-sast-response.json \
            -X POST "${CONCERT_URL}/ingestion/api/v1/upload_files" \
            -H "accept: application/json" \
            -H "Content-Type: multipart/form-data" \
            -H "InstanceID: ${CONCERT_INSTANCE_ID}" \
            -H "Authorization: C_API_KEY ${CONCERT_API_KEY}" \
            -F "data_type=static_code_scan" \
            -F "filename=@${SARIF_JSON}" \
            -F "metadata={\"env_name\":\"prod\",\"repo_url\":\"${REPO_URL}\",\"repo_name\":\"${REPO_NAME}\",\"tool\":\"semgrep\",\"format\":\"sarif\"}" \
            --connect-timeout 10 \
            --max-time 60)
          
          echo "HTTP Response Code: ${HTTP_CODE}"
          echo ""
          
          # Check if HTTP_CODE is a valid number
          if ! [[ "${HTTP_CODE}" =~ ^[0-9]+$ ]]; then
            echo "⚠️  Invalid HTTP response code: ${HTTP_CODE}"
            echo "This may indicate a network or curl error"
            cat /tmp/concert-sast-response.json 2>/dev/null || true
          elif [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 300 ]; then
            echo "✓ Semgrep SAST results uploaded successfully to Concert"
            if [ -f /tmp/concert-sast-response.json ]; then
              echo ""
              echo "Response:"
              cat /tmp/concert-sast-response.json 2>/dev/null | jq . 2>/dev/null || cat /tmp/concert-sast-response.json
            fi
          elif [ "${HTTP_CODE}" = "401" ]; then
            echo "❌ Concert SAST upload failed: Authentication error (HTTP ${HTTP_CODE})"
            echo "Check CONCERT_API_KEY and CONCERT_INSTANCE_ID secrets"
            echo "Response:"
            cat /tmp/concert-sast-response.json 2>/dev/null || true
          elif [ "${HTTP_CODE}" = "404" ]; then
            echo "❌ Concert SAST upload failed: Application not found (HTTP ${HTTP_CODE})"
            echo "Ensure 'demo-turbo-instana-concert' application exists in Concert"
            echo "Response:"
            cat /tmp/concert-sast-response.json 2>/dev/null || true
          elif [ "${HTTP_CODE}" = "000" ]; then
            echo "❌ Concert SAST upload failed: Cannot connect to Concert API"
            echo "Check CONCERT_URL and network connectivity"
          else
            echo "⚠️  Concert SAST upload failed with HTTP ${HTTP_CODE}"
            echo "Response:"
            cat /tmp/concert-sast-response.json 2>/dev/null || true
          fi
          
          echo ""
          echo "Note: Upload failures are non-blocking, workflow continues..."
          echo "============================================"

      # Step 5: Install kubectl
      - name: Install kubectl
        run: |
          echo "Installing kubectl..."
          
          # Detect if we have sudo or running as root
          if command -v sudo &> /dev/null; then
            SUDO="sudo"
          elif [ "$(id -u)" -eq 0 ]; then
            SUDO=""
            echo "Running as root, sudo not needed"
          else
            SUDO=""
            echo "⚠️  Warning: No sudo available and not running as root"
          fi
          
          # Check if kubectl is already installed
          if command -v kubectl &> /dev/null; then
            echo "✓ kubectl is already installed"
            kubectl version --client
          else
            echo "Installing kubectl from official repository..."
            
            # Download latest stable kubectl
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            
            # Verify the binary (optional)
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl.sha256"
            echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
            
            # Install kubectl
            if [ -n "$SUDO" ]; then
              $SUDO install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
            else
              # If no sudo, try to install to user's local bin or current directory
              if [ -w /usr/local/bin ]; then
                install -m 0755 kubectl /usr/local/bin/kubectl
              elif [ -d "$HOME/.local/bin" ]; then
                mkdir -p "$HOME/.local/bin"
                install -m 0755 kubectl "$HOME/.local/bin/kubectl"
                export PATH="$HOME/.local/bin:$PATH"
              else
                install -m 0755 kubectl ./kubectl
                export PATH="$(pwd):$PATH"
              fi
            fi
            
            # Clean up
            rm -f kubectl.sha256
            
            # Verify installation
            kubectl version --client
            echo "✓ kubectl installed successfully"
          fi

      # Step 4: Verify Docker is available
      - name: Verify Docker
        run: |
          echo "Checking for Docker..."
          echo "Current user: $(whoami)"
          echo "Current groups: $(groups)"
          echo "PATH: $PATH"
          echo ""
          
          # Debug: Check if files exist
          echo "Checking file existence:"
          ls -la /usr/bin/docker 2>&1 || echo "/usr/bin/docker not found"
          ls -la /usr/local/bin/docker 2>&1 || echo "/usr/local/bin/docker not found"
          ls -la /bin/docker 2>&1 || echo "/bin/docker not found"
          echo ""
          
          # Try to find docker using which
          echo "Trying 'which docker':"
          which docker 2>&1 || echo "docker not in PATH"
          echo ""
          
          # Try common Docker locations
          DOCKER_BIN=""
          for path in /usr/bin/docker /usr/local/bin/docker /bin/docker; do
            echo "Checking: $path"
            if [ -f "$path" ]; then
              echo "  File exists: yes"
              if [ -x "$path" ]; then
                echo "  Executable: yes"
                DOCKER_BIN="$path"
                break
              else
                echo "  Executable: no (permissions: $(stat -c '%a' $path 2>/dev/null || stat -f '%p' $path))"
              fi
            else
              echo "  File exists: no"
            fi
          done
          echo ""
          
          if [ -z "$DOCKER_BIN" ]; then
            echo "❌ ERROR: Docker binary not found or not executable!"
            echo ""
            echo "Debug info:"
            echo "  - Check if Docker is installed: rpm -qa | grep docker"
            echo "  - Check Docker service: systemctl status docker"
            echo "  - Check runner user: whoami"
            echo "  - Check runner groups: groups"
            exit 1
          fi
          
          echo "Found Docker at: $DOCKER_BIN"
          $DOCKER_BIN --version
          $DOCKER_BIN info
          echo "✓ Docker is available and working"

      # Step 6: Verify kubectl is available
      - name: Verify kubectl
        run: |
          echo "Checking for kubectl..."
          
          # Try common kubectl locations
          KUBECTL_BIN=""
          for path in /usr/local/bin/kubectl /usr/bin/kubectl /bin/kubectl; do
            if [ -x "$path" ]; then
              KUBECTL_BIN="$path"
              break
            fi
          done
          
          if [ -z "$KUBECTL_BIN" ]; then
            echo "❌ ERROR: kubectl binary not found!"
            echo "Searched locations: /usr/local/bin/kubectl, /usr/bin/kubectl, /bin/kubectl"
            echo ""
            echo "Please install kubectl on the runner host:"
            echo "  curl -LO 'https://dl.k8s.io/release/\$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl'"
            echo "  sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl"
            exit 1
          fi
          
          echo "Found kubectl at: $KUBECTL_BIN"
          $KUBECTL_BIN version --client
          echo "✓ kubectl is available and working"

      # Step 7: Configure Docker for HTTP Registry
      - name: Configure Docker for HTTP Registry
        run: |
          echo "Configuring Docker to allow insecure registry..."
          
          # Detect if we have sudo or running as root
          if command -v sudo &> /dev/null; then
            SUDO="sudo"
          elif [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          else
            SUDO=""
          fi
          
          # Create or update Docker daemon.json
          DAEMON_JSON="/etc/docker/daemon.json"
          REGISTRY="${{ secrets.GIT_REGISTRY }}"
          
          # Backup existing config if it exists
          if [ -f "$DAEMON_JSON" ]; then
            $SUDO cp "$DAEMON_JSON" "${DAEMON_JSON}.backup" 2>/dev/null || cp "$DAEMON_JSON" "${DAEMON_JSON}.backup" 2>/dev/null || true
          fi
          
          # Create daemon.json with insecure-registries
          echo "Creating/updating daemon.json..."
          $SUDO mkdir -p /etc/docker 2>/dev/null || mkdir -p /etc/docker 2>/dev/null || true
          
          # Create the JSON content using echo
          $SUDO bash -c "echo '{' > $DAEMON_JSON" || bash -c "echo '{' > $DAEMON_JSON"
          $SUDO bash -c "echo '  \"insecure-registries\": [\"${REGISTRY}\"]' >> $DAEMON_JSON" || bash -c "echo '  \"insecure-registries\": [\"${REGISTRY}\"]' >> $DAEMON_JSON"
          $SUDO bash -c "echo '}' >> $DAEMON_JSON" || bash -c "echo '}' >> $DAEMON_JSON"
          
          echo "✓ Docker daemon.json configured"
          cat "$DAEMON_JSON"
          
          # Restart Docker to apply changes
          echo "Restarting Docker daemon..."
          if command -v systemctl &> /dev/null; then
            $SUDO systemctl restart docker || true
            sleep 5
            $SUDO systemctl status docker --no-pager || true
          else
            echo "⚠️  systemctl not available, Docker may need manual restart"
          fi
          
          echo "✓ Docker configured for HTTP registry: ${REGISTRY}"

      # Step 8: Login to Registry
      - name: Login to Gitea Registry
        run: |
          # Wait for Docker daemon to fully restart after config change
          sleep 3
          
          # Login to HTTP registry
          echo "${{ secrets.GIT_TOKEN }}" | docker login http://${{ secrets.GIT_REGISTRY }} \
            --username ${{ secrets.GIT_USERNAME }} \
            --password-stdin
          echo "✓ Logged in to HTTP registry: ${{ secrets.GIT_REGISTRY }}"

      # Step 10: Build and Push Java Echo Service
      - name: Build and Push Java Echo Service
        run: |
          # Convert repository name to lowercase for Docker compatibility
          REPO_LOWER=$(echo "${{ gitea.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="${{ secrets.GIT_REGISTRY }}/${REPO_LOWER}/echo-service"
          
          echo "Current directory: $(pwd)"
          echo "Listing files:"
          ls -la
          
          echo "Building Java Echo Service: ${IMAGE_NAME}:latest"
          docker build -t ${IMAGE_NAME}:latest -t ${IMAGE_NAME}:${{ gitea.sha }} \
            -f java-app/Dockerfile \
            java-app
          
          echo "Pushing Java Echo Service images..."
          docker push ${IMAGE_NAME}:latest
          docker push ${IMAGE_NAME}:${{ gitea.sha }}
          echo "✓ Java Echo Service images pushed successfully"

      # Step 11: Build and Push Python Load Test App
      - name: Build and Push Python Load Test App
        run: |
          # Convert repository name to lowercase for Docker compatibility
          REPO_LOWER=$(echo "${{ gitea.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="${{ secrets.GIT_REGISTRY }}/${REPO_LOWER}/load-test-app"
          
          echo "Building Python Load Test App: ${IMAGE_NAME}:latest"
          docker build -t ${IMAGE_NAME}:latest -t ${IMAGE_NAME}:${{ gitea.sha }} \
            -f python-app/Dockerfile \
            python-app
          
          echo "Pushing Python Load Test App images..."
          docker push ${IMAGE_NAME}:latest
          docker push ${IMAGE_NAME}:${{ gitea.sha }}
          echo "✓ Python Load Test App images pushed successfully"

      # Step 12: Generate SBOM for Java App
      - name: Generate SBOM for Java App
        continue-on-error: true
        run: |
          REPO_LOWER=$(echo "${{ gitea.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="${{ secrets.GIT_REGISTRY }}/${REPO_LOWER}/echo-service"
          
          echo "============================================"
          echo "Generating SBOM for Java Echo Service"
          echo "============================================"
          echo "Image: ${IMAGE_NAME}:latest"
          echo "Workspace: $WORKSPACE_DIR"
          echo ""
          
          # Create output directories
          mkdir -p /tmp/sbom-output
          mkdir -p "$WORKSPACE_DIR"
          
          # Check if image exists
          if ! docker image inspect "${IMAGE_NAME}:latest" &> /dev/null; then
            echo "⚠️  Warning: Image ${IMAGE_NAME}:latest not found locally"
            echo "Attempting to pull image..."
            if ! docker pull "${IMAGE_NAME}:latest"; then
              echo "❌ Failed to pull image. SBOM generation skipped."
              echo "This is non-blocking, workflow will continue..."
              exit 0
            fi
          fi
          
          echo "✓ Image found, generating SBOM..."
          echo ""
          
          # Check for syft
          if command -v syft &> /dev/null; then
            # Generate SBOM with syft installed on host
            echo "Using native syft ($(syft version))..."
            if syft "${IMAGE_NAME}:latest" \
              -o cyclonedx-json="$WORKSPACE_DIR/sbom-java-cyclonedx.json"; then
              echo "✓ Java SBOM generated to workspace"
              # Copy to /tmp for backup
              cp "$WORKSPACE_DIR/sbom-java-cyclonedx.json" "/tmp/sbom-output/sbom-java-cyclonedx.json" 2>/dev/null || true
            else
              echo "❌ Syft scan failed (native)"
              exit 1
            fi
          else
            # Generate SBOM using Docker container - capture output to stdout
            echo "Using Docker-based syft..."
            echo "Debug: Current directory: $(pwd)"
            echo "Debug: Workspace directory: $WORKSPACE_DIR"
            
            # Capture SBOM output to variable
            SBOM_OUTPUT=$(docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              anchore/syft:latest \
              "${IMAGE_NAME}:latest" \
              -o cyclonedx-json 2>&1)
            
            SYFT_EXIT=$?
            
            if [ $SYFT_EXIT -eq 0 ]; then
              echo "✓ Java SBOM generated"
              
              # Write output to file
              echo "$SBOM_OUTPUT" > sbom-java-cyclonedx.json
              echo "✓ SBOM file written to current directory"
              ls -lh sbom-java-cyclonedx.json
              
              # Copy to workspace and /tmp
              cp sbom-java-cyclonedx.json "$WORKSPACE_DIR/" 2>/dev/null && echo "✓ Copied to workspace" || echo "⚠️  Could not copy to workspace"
              cp sbom-java-cyclonedx.json "/tmp/sbom-output/" 2>/dev/null && echo "✓ Copied to /tmp" || echo "⚠️  Could not copy to /tmp"
            else
              echo "❌ Syft scan failed (Docker) with exit code $SYFT_EXIT"
              echo "Output: $SBOM_OUTPUT"
              exit 1
            fi
          fi
          
          echo ""
          echo "Verifying generated files:"
          echo ""
          echo "Current directory ($(pwd)):"
          ls -lh sbom-java*.json 2>/dev/null || echo "  ⚠️  No files found"
          echo ""
          echo "Workspace directory ($WORKSPACE_DIR):"
          ls -lh "$WORKSPACE_DIR"/sbom-java*.json 2>/dev/null || echo "  ⚠️  No files found"
          echo ""
          echo "/tmp/sbom-output directory:"
          ls -lh /tmp/sbom-output/sbom-java*.json 2>/dev/null || echo "  ⚠️  No files found"
          echo ""
          
          # Verify at least one file was created
          if [ -f "sbom-java-cyclonedx.json" ] || [ -f "$WORKSPACE_DIR/sbom-java-cyclonedx.json" ] || [ -f "/tmp/sbom-output/sbom-java-cyclonedx.json" ]; then
            echo "✓ SBOM file verification passed"
          else
            echo "❌ SBOM file verification failed - no files created"
            exit 1
          fi
          echo "============================================"

      # Step 13: Generate SBOM for Python App
      - name: Generate SBOM for Python App
        continue-on-error: true
        run: |
          REPO_LOWER=$(echo "${{ gitea.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="${{ secrets.GIT_REGISTRY }}/${REPO_LOWER}/load-test-app"
          
          echo "============================================"
          echo "Generating SBOM for Python Load Test App"
          echo "============================================"
          echo "Image: ${IMAGE_NAME}:latest"
          echo "Workspace: $WORKSPACE_DIR"
          echo ""
          
          # Create output directories
          mkdir -p /tmp/sbom-output
          mkdir -p "$WORKSPACE_DIR"
          
          # Check if image exists
          if ! docker image inspect "${IMAGE_NAME}:latest" &> /dev/null; then
            echo "⚠️  Warning: Image ${IMAGE_NAME}:latest not found locally"
            echo "Attempting to pull image..."
            if ! docker pull "${IMAGE_NAME}:latest"; then
              echo "❌ Failed to pull image. SBOM generation skipped."
              echo "This is non-blocking, workflow will continue..."
              exit 0
            fi
          fi
          
          echo "✓ Image found, generating SBOM..."
          echo ""
          
          # Check for syft
          if command -v syft &> /dev/null; then
            # Generate SBOM with syft installed on host
            echo "Using native syft ($(syft version))..."
            if syft "${IMAGE_NAME}:latest" \
              -o cyclonedx-json="$WORKSPACE_DIR/sbom-python-cyclonedx.json"; then
              echo "✓ Python SBOM generated to workspace"
              # Copy to /tmp for backup
              cp "$WORKSPACE_DIR/sbom-python-cyclonedx.json" "/tmp/sbom-output/sbom-python-cyclonedx.json" 2>/dev/null || true
            else
              echo "❌ Syft scan failed (native)"
              exit 1
            fi
          else
            # Generate SBOM using Docker container - capture output to stdout
            echo "Using Docker-based syft..."
            echo "Debug: Current directory: $(pwd)"
            echo "Debug: Workspace directory: $WORKSPACE_DIR"
            
            # Capture SBOM output to variable
            SBOM_OUTPUT=$(docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              anchore/syft:latest \
              "${IMAGE_NAME}:latest" \
              -o cyclonedx-json 2>&1)
            
            SYFT_EXIT=$?
            
            if [ $SYFT_EXIT -eq 0 ]; then
              echo "✓ Python SBOM generated"
              
              # Write output to file
              echo "$SBOM_OUTPUT" > sbom-python-cyclonedx.json
              echo "✓ SBOM file written to current directory"
              ls -lh sbom-python-cyclonedx.json
              
              # Copy to workspace and /tmp
              cp sbom-python-cyclonedx.json "$WORKSPACE_DIR/" 2>/dev/null && echo "✓ Copied to workspace" || echo "⚠️  Could not copy to workspace"
              cp sbom-python-cyclonedx.json "/tmp/sbom-output/" 2>/dev/null && echo "✓ Copied to /tmp" || echo "⚠️  Could not copy to /tmp"
            else
              echo "❌ Syft scan failed (Docker) with exit code $SYFT_EXIT"
              echo "Output: $SBOM_OUTPUT"
              exit 1
            fi
          fi
          
          echo ""
          echo "Verifying generated files:"
          echo ""
          echo "Current directory ($(pwd)):"
          ls -lh sbom-python*.json 2>/dev/null || echo "  ⚠️  No files found"
          echo ""
          echo "Workspace directory ($WORKSPACE_DIR):"
          ls -lh "$WORKSPACE_DIR"/sbom-python*.json 2>/dev/null || echo "  ⚠️  No files found"
          echo ""
          echo "/tmp/sbom-output directory:"
          ls -lh /tmp/sbom-output/sbom-python*.json 2>/dev/null || echo "  ⚠️  No files found"
          echo ""
          
          # Verify at least one file was created
          if [ -f "sbom-python-cyclonedx.json" ] || [ -f "$WORKSPACE_DIR/sbom-python-cyclonedx.json" ] || [ -f "/tmp/sbom-output/sbom-python-cyclonedx.json" ]; then
            echo "✓ SBOM file verification passed"
          else
            echo "❌ SBOM file verification failed - no files created"
            exit 1
          fi
          echo "============================================"

      # Step 14: Upload SBOM to Concert
      - name: Upload SBOM to Concert
        if: secrets.CONCERT_URL != ''
        continue-on-error: true
        env:
          CONCERT_URL: ${{ secrets.CONCERT_URL }}
          CONCERT_API_KEY: ${{ secrets.CONCERT_API_KEY }}
          CONCERT_INSTANCE_ID: ${{ secrets.CONCERT_INSTANCE_ID }}
        run: |
          echo "============================================"
          echo "Uploading SBOM Files to Concert"
          echo "============================================"
          echo "Application: demo-turbo-instana-concert"
          echo "Concert URL: ${CONCERT_URL}"
          echo ""
          
          # Check for SBOM files in multiple locations
          SBOM_DIR="${WORKSPACE_DIR:-.}"
          echo "Looking for SBOM files in: ${SBOM_DIR}"
          ls -lh "${SBOM_DIR}"/sbom-*.json 2>/dev/null || echo "No SBOM files found in workspace"
          echo ""
          
          # Also check /tmp/sbom-output as fallback
          echo "Checking /tmp/sbom-output for SBOM files..."
          ls -lh /tmp/sbom-output/sbom-*.json 2>/dev/null || echo "No SBOM files found in /tmp/sbom-output"
          echo ""
          
          # Determine which directory has the SBOM files
          if [ -f "${SBOM_DIR}/sbom-java-cyclonedx.json" ] || [ -f "${SBOM_DIR}/sbom-python-cyclonedx.json" ]; then
            echo "Using SBOM files from workspace: ${SBOM_DIR}"
          elif [ -f "/tmp/sbom-output/sbom-java-cyclonedx.json" ] || [ -f "/tmp/sbom-output/sbom-python-cyclonedx.json" ]; then
            echo "Using SBOM files from /tmp/sbom-output"
            SBOM_DIR="/tmp/sbom-output"
          else
            echo "⚠️  No SBOM files found in any location. Skipping upload."
            echo "This may indicate SBOM generation failed or was skipped."
            exit 0
          fi
          echo ""
          
          # Upload Java SBOM using Concert Ingestion API (multipart form data)
          if [ -f "${SBOM_DIR}/sbom-java-cyclonedx.json" ]; then
            echo "Uploading Java SBOM (CycloneDX format)..."
            echo "Using Concert Ingestion API: ${CONCERT_URL}/ingestion/api/v1/upload_files"
            
            HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/concert-sbom-java-response.json \
              -X POST "${CONCERT_URL}/ingestion/api/v1/upload_files" \
              -H "Accept: application/json" \
              -H "Content-Type: multipart/form-data" \
              -H "InstanceID: ${CONCERT_INSTANCE_ID}" \
              -H "Authorization: C_API_KEY ${CONCERT_API_KEY}" \
              -F "data_type=package_sbom" \
              -F "filename=@${SBOM_DIR}/sbom-java-cyclonedx.json")
            
            echo "HTTP Response Code: ${HTTP_CODE}"
            
            if ! [[ "${HTTP_CODE}" =~ ^[0-9]+$ ]]; then
              echo "⚠️  Invalid HTTP response code: ${HTTP_CODE}"
              cat /tmp/concert-sbom-java-response.json 2>/dev/null || true
            elif [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 300 ]; then
              echo "✓ Java SBOM uploaded successfully to Concert"
              echo "Response:"
              cat /tmp/concert-sbom-java-response.json 2>/dev/null || true
            else
              echo "⚠️  Java SBOM upload failed with HTTP ${HTTP_CODE}"
              echo "Response:"
              cat /tmp/concert-sbom-java-response.json 2>/dev/null || true
            fi
          else
            echo "⚠️  Java SBOM file not found: ${SBOM_DIR}/sbom-java-cyclonedx.json"
          fi
          
          echo ""
          
          # Upload Python SBOM using Concert Ingestion API (multipart form data)
          if [ -f "${SBOM_DIR}/sbom-python-cyclonedx.json" ]; then
            echo "Uploading Python SBOM (CycloneDX format)..."
            echo "Using Concert Ingestion API: ${CONCERT_URL}/ingestion/api/v1/upload_files"
            
            HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/concert-sbom-python-response.json \
              -X POST "${CONCERT_URL}/ingestion/api/v1/upload_files" \
              -H "Accept: application/json" \
              -H "Content-Type: multipart/form-data" \
              -H "InstanceID: ${CONCERT_INSTANCE_ID}" \
              -H "Authorization: C_API_KEY ${CONCERT_API_KEY}" \
              -F "data_type=package_sbom" \
              -F "filename=@${SBOM_DIR}/sbom-python-cyclonedx.json")
            
            echo "HTTP Response Code: ${HTTP_CODE}"
            
            if ! [[ "${HTTP_CODE}" =~ ^[0-9]+$ ]]; then
              echo "⚠️  Invalid HTTP response code: ${HTTP_CODE}"
              cat /tmp/concert-sbom-python-response.json 2>/dev/null || true
            elif [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 300 ]; then
              echo "✓ Python SBOM uploaded successfully to Concert"
              echo "Response:"
              cat /tmp/concert-sbom-python-response.json 2>/dev/null || true
            else
              echo "⚠️  Python SBOM upload failed with HTTP ${HTTP_CODE}"
              echo "Response:"
              cat /tmp/concert-sbom-python-response.json 2>/dev/null || true
            fi
          else
            echo "⚠️  Python SBOM file not found: ${SBOM_DIR}/sbom-python-cyclonedx.json"
          fi
          
          echo ""
          echo "✓ SBOM upload process completed"
          echo "Note: Upload failures are non-blocking, workflow continues..."
          echo "============================================"

      # Step 15: Archive SBOM Files (for local reference)
      - name: Archive SBOM Files
        continue-on-error: true
        run: |
          echo "============================================"
          echo "Archiving SBOM Files"
          echo "============================================"
          
          # Create archive directory
          ARCHIVE_DIR="/tmp/sbom-archive-$(date +%Y%m%d-%H%M%S)"
          mkdir -p "$ARCHIVE_DIR"
          
          # Copy SBOM files to archive
          if [ -f "sbom-java-cyclonedx.json" ]; then
            cp sbom-java-cyclonedx.json "$ARCHIVE_DIR/" && echo "✓ Archived Java SBOM"
          fi
          
          if [ -f "sbom-python-cyclonedx.json" ]; then
            cp sbom-python-cyclonedx.json "$ARCHIVE_DIR/" && echo "✓ Archived Python SBOM"
          fi
          
          if [ -f "semgrep-results.sarif" ]; then
            cp semgrep-results.sarif "$ARCHIVE_DIR/" && echo "✓ Archived Semgrep SARIF"
          fi
          
          if [ -f "semgrep-results.json" ]; then
            cp semgrep-results.json "$ARCHIVE_DIR/" && echo "✓ Archived Semgrep JSON"
          fi
          
          echo ""
          echo "Archive location: $ARCHIVE_DIR"
          ls -lh "$ARCHIVE_DIR"
          echo "============================================"

      # Step 16: Setup kubeconfig
      - name: Setup kubeconfig
        run: |
          mkdir -p $HOME/.kube
          
          # Decode kubeconfig if base64, otherwise use as-is
          if echo "${{ secrets.KUBECONFIG }}" | base64 -d > /dev/null 2>&1; then
            echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
            echo "✓ Decoded base64 kubeconfig"
          else
            echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
            echo "✓ Used plain text kubeconfig"
          fi
          
          chmod 600 $HOME/.kube/config
          
          # Verify kubectl can connect
          kubectl cluster-info
          echo "✓ kubectl configured and connected"

      # Step 17: Create Namespace
      - name: Create Namespace
        run: |
          echo "Creating namespace: demo-turbo-instana-concert"
          kubectl apply -f $WORKSPACE_DIR/k8s/namespace.yaml
          echo "✓ Namespace created/updated"

      # Step 18: Apply ConfigMaps
      - name: Apply ConfigMaps
        run: |
          echo "Applying ConfigMaps..."
          kubectl apply -f $WORKSPACE_DIR/k8s/configmaps.yaml
          echo "✓ ConfigMaps applied"

      # Step 19: Verify Registry Configuration on Nodes
      - name: Verify Registry Configuration on Nodes
        run: |
          echo "Verifying registry configuration..."
          REGISTRY="${{ secrets.GIT_REGISTRY }}"
          
          echo "Registry to be used: $REGISTRY"
          echo ""
          echo "⚠️  IMPORTANT: Ensure Docker daemon on ALL Kubernetes nodes has this configuration:"
          echo ""
          cat <<'EOFCONFIG'
          # /etc/docker/daemon.json
          {
            "insecure-registries": ["REGISTRY_ADDRESS"]
          }
          EOFCONFIG
          echo ""
          echo "Replace REGISTRY_ADDRESS with: $REGISTRY"
          echo ""
          echo "After updating daemon.json on each node, restart Docker:"
          echo "  sudo systemctl restart docker"
          echo ""
          echo "Continuing with deployment..."

      # Step 20: Deploy Java Echo Service
      - name: Deploy Java Echo Service
        run: |
          echo "Deploying Java Echo Service..."
          REPO_LOWER=$(echo "${{ gitea.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_FULL="${{ secrets.GIT_REGISTRY }}/${REPO_LOWER}/echo-service:latest"
          
          echo "Image to deploy: $IMAGE_FULL"
          
          # Apply deployment with substitutions
          sed -e "s|\${IMAGE_REGISTRY}|${{ secrets.GIT_REGISTRY }}|g" \
              -e "s|\${IMAGE_REPOSITORY}|${REPO_LOWER}/echo-service|g" \
              -e "s|\${IMAGE_TAG}|latest|g" \
              $WORKSPACE_DIR/k8s/echo-service-deployment.yaml | kubectl apply -f -
          
          echo "Waiting for deployment rollout..."
          if kubectl rollout status deployment/vulnerable-echo-service -n demo-turbo-instana-concert --timeout=5m; then
            echo "✓ Java Echo Service deployed successfully"
          else
            echo "⚠️  Deployment rollout did not complete in time"
            echo "Checking pod status..."
            kubectl get pods -n demo-turbo-instana-concert -l app=vulnerable-echo-service
            echo ""
            echo "Checking pod events..."
            kubectl describe pods -n demo-turbo-instana-concert -l app=vulnerable-echo-service | grep -A 20 "Events:"
            echo ""
            echo "If you see ImagePullBackOff errors, ensure:"
            echo "  1. Registry ${{ secrets.GIT_REGISTRY }} is accessible from cluster"
            echo "  2. Docker daemon on nodes has insecure-registries configured"
            echo "  3. Image exists: $IMAGE_FULL"
            exit 1
          fi

      # Step 21: Deploy Python Load Test App
      - name: Deploy Python Load Test App
        run: |
          echo "Deploying Python Load Test App..."
          REPO_LOWER=$(echo "${{ gitea.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_FULL="${{ secrets.GIT_REGISTRY }}/${REPO_LOWER}/load-test-app:latest"
          
          echo "Image to deploy: $IMAGE_FULL"
          
          # Apply deployment with substitutions
          sed -e "s|\${IMAGE_REGISTRY}|${{ secrets.GIT_REGISTRY }}|g" \
              -e "s|\${IMAGE_REPOSITORY}|${REPO_LOWER}/load-test-app|g" \
              -e "s|\${IMAGE_TAG}|latest|g" \
              $WORKSPACE_DIR/k8s/python-app-deployment.yaml | kubectl apply -f -
          
          echo "Waiting for deployment rollout..."
          if kubectl rollout status deployment/load-test-app -n demo-turbo-instana-concert --timeout=5m; then
            echo "✓ Python Load Test App deployed successfully"
          else
            echo "⚠️  Deployment rollout did not complete in time"
            echo "Checking pod status..."
            kubectl get pods -n demo-turbo-instana-concert -l app=load-test-app
            echo ""
            echo "Checking pod events..."
            kubectl describe pods -n demo-turbo-instana-concert -l app=load-test-app | grep -A 20 "Events:"
            echo ""
            echo "If you see ImagePullBackOff errors, ensure:"
            echo "  1. Registry ${{ secrets.GIT_REGISTRY }} is accessible from cluster"
            echo "  2. Docker daemon on nodes has insecure-registries configured"
            echo "  3. Image exists: $IMAGE_FULL"
            exit 1
          fi

      # Step 22: Create TLS Certificate
      - name: Create TLS Certificate
        run: |
          INGRESS_HOST="${{ secrets.INGRESS_HOST }}"
          echo "Creating TLS certificate for: $INGRESS_HOST"
          
          if kubectl get secret demo-turbo-instana-concert-tls -n demo-turbo-instana-concert &> /dev/null; then
            echo "✓ TLS secret already exists"
          else
            echo "Creating self-signed TLS certificate..."
            openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
              -keyout $WORKSPACE_DIR/tls.key -out $WORKSPACE_DIR/tls.crt \
              -subj "/CN=${INGRESS_HOST}/O=Demo Turbo Instana Concert" \
              2>/dev/null
            
            kubectl create secret tls demo-turbo-instana-concert-tls \
              --cert=$WORKSPACE_DIR/tls.crt \
              --key=$WORKSPACE_DIR/tls.key \
              -n demo-turbo-instana-concert
            
            rm -f $WORKSPACE_DIR/tls.key $WORKSPACE_DIR/tls.crt
            echo "✓ TLS certificate created for: $INGRESS_HOST"
          fi

      # Step 23: Deploy Ingress
      - name: Deploy Ingress
        run: |
          echo "Deploying Ingress..."
          INGRESS_HOST="${{ secrets.INGRESS_HOST }}"
          
          sed -e "s|\${INGRESS_HOST}|${INGRESS_HOST}|g" \
              $WORKSPACE_DIR/k8s/ingress.yaml | kubectl apply -f -
          
          echo "✓ Ingress deployed for host: ${INGRESS_HOST}"
          echo "  - HTTP access:  http://${INGRESS_HOST}"
          echo "  - HTTPS access: https://${INGRESS_HOST}"

      # Step 24: Apply Network Policy
      - name: Apply Network Policy
        run: |
          cat <<'EOFNETPOL' | kubectl apply -f -
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: demo-turbo-instana-concert-netpol
            namespace: demo-turbo-instana-concert
          spec:
            podSelector: {}
            policyTypes:
            - Ingress
            - Egress
            ingress:
            - {}
            egress:
            - {}
          EOFNETPOL
          echo "✓ Network policy applied"

      # Step 25: Get Deployment Info
      - name: Get Deployment Info
        run: |
          INGRESS_HOST="${{ secrets.INGRESS_HOST }}"
          CLUSTER_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}' 2>/dev/null || echo "<K8S_IP>")
          REPO_LOWER=$(echo "${{ gitea.repository }}" | tr '[:upper:]' '[:lower:]')
          
          echo "==================================="
          echo "Deployment Information"
          echo "==================================="
          echo ""
          echo "Namespace: demo-turbo-instana-concert"
          echo ""
          echo "Java Echo Service:"
          kubectl get deployment vulnerable-echo-service -n demo-turbo-instana-concert
          kubectl get pods -l app=vulnerable-echo-service -n demo-turbo-instana-concert
          kubectl get service vulnerable-echo-service -n demo-turbo-instana-concert
          echo ""
          echo "Python Load Test App:"
          kubectl get deployment load-test-app -n demo-turbo-instana-concert
          kubectl get pods -l app=load-test-app -n demo-turbo-instana-concert
          kubectl get service load-test-service -n demo-turbo-instana-concert
          echo ""
          echo "Ingress:"
          kubectl get ingress -n demo-turbo-instana-concert
          echo ""
          echo "🌐 Access URLs:"
          echo "  HTTP:  http://${INGRESS_HOST}"
          echo "  HTTPS: https://${INGRESS_HOST} (self-signed cert)"
          echo ""
          echo "📋 Add to /etc/hosts on your machine:"
          echo "  ${CLUSTER_IP}  ${INGRESS_HOST}"
          echo ""
          echo "🧪 Test Commands:"
          echo "  # Health check"
          echo "  curl http://${INGRESS_HOST}/health"
          echo ""
          echo "  # Echo service"
          echo "  curl http://${INGRESS_HOST}/api/echo"
          echo ""
          echo "  # Load test endpoints"
          echo "  curl http://${INGRESS_HOST}/stress"
          echo "  curl http://${INGRESS_HOST}/metrics"
          echo ""
          echo "🔑 Images Built:"
          echo "  - ${{ secrets.GIT_REGISTRY }}/${REPO_LOWER}/echo-service:latest"
          echo "  - ${{ secrets.GIT_REGISTRY }}/${REPO_LOWER}/load-test-app:latest"
          echo "==================================="
      # Step: Run OWASP ZAP Security Scan
      - name: Deploy ZAP Security Scan
        run: |
          echo "==================================="
          echo "🔒 Running OWASP ZAP Security Scan"
          echo "==================================="
          
          # Clean up any existing ZAP scan jobs
          kubectl delete job zap-full-scan -n demo-turbo-instana-concert --ignore-not-found=true
          sleep 5
          
          # Deploy the ZAP scan job
          kubectl apply -f k8s/zaptest.yaml
          
          echo "✓ ZAP scan job deployed"
          echo "Monitor progress: kubectl logs -f job/zap-full-scan -n demo-turbo-instana-concert"
      
      - name: Wait for ZAP Scan Completion
        run: |
          echo "Waiting for ZAP scan to start..."
          sleep 15
          
          # Get pod name
          POD_NAME=$(kubectl get pods -n demo-turbo-instana-concert -l job-name=zap-full-scan -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          
          if [ -z "$POD_NAME" ]; then
            echo "⚠️  Warning: ZAP scan pod not found. Scan may still be starting."
            exit 0
          fi
          
          echo "ZAP scan pod: $POD_NAME"
          echo "Waiting for pod to be ready..."
          kubectl wait --for=condition=Ready pod/$POD_NAME -n demo-turbo-instana-concert --timeout=120s || true
          
          echo ""
          echo "📊 ZAP Scan Progress (first 50 lines):"
          kubectl logs pod/$POD_NAME -n demo-turbo-instana-concert --tail=50 || true
          
          echo ""
          echo "⏳ Scan is running in background. It will complete in 5-15 minutes."
          echo "   The scan will continue even after this workflow completes."
        continue-on-error: true
      
      - name: Retrieve ZAP Scan Results (if available)
        run: |
          echo "============================================"
          echo "Waiting for ZAP Scan Completion"
          echo "============================================"
          echo ""
          
          # Wait up to 15 minutes for job completion
          echo "⏳ Waiting for ZAP scan to complete (timeout: 15 minutes)..."
          echo "This is a comprehensive security scan and may take time."
          echo ""
          
          if kubectl wait --for=condition=complete job/zap-full-scan \
            -n demo-turbo-instana-concert \
            --timeout=900s 2>/dev/null; then
            echo "✅ ZAP scan completed successfully!"
          else
            echo "⚠️  Scan did not complete within 15 minutes"
            echo "Checking if reports are available anyway..."
          fi
          
          echo ""
          
          # Get pod name
          POD_NAME=$(kubectl get pods -n demo-turbo-instana-concert -l job-name=zap-full-scan -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          
          if [ -z "$POD_NAME" ]; then
            echo "⚠️  ZAP scan pod not found. Skipping report retrieval."
            echo ""
            echo "To retrieve reports manually after scan completes:"
            echo "  ./scripts/upload-zap-to-concert.sh"
            exit 0
          fi
          
          echo "ZAP scan pod: $POD_NAME"
          
          # Check if scan completed
          JOB_STATUS=$(kubectl get job zap-full-scan -n demo-turbo-instana-concert -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || echo "")
          
          if [ "$JOB_STATUS" != "True" ]; then
            echo "⏳ ZAP scan is still running. Reports will be available later."
            echo ""
            echo "To retrieve and upload reports manually after scan completes:"
            echo "  ./scripts/upload-zap-to-concert.sh"
            echo ""
            echo "Or retrieve reports manually:"
            echo "  POD_NAME=\$(kubectl get pods -n demo-turbo-instana-concert -l job-name=zap-full-scan -o jsonpath='{.items[0].metadata.name}')"
            echo "  kubectl -n demo-turbo-instana-concert cp \$POD_NAME:/zap/wrk/full-scan-report.html ./concert-security-scan.html"
            echo "  kubectl -n demo-turbo-instana-concert cp \$POD_NAME:/zap/wrk/full-scan-report.json ./concert-security-scan.json"
            exit 0
          fi
          
          echo "✓ ZAP scan completed! Retrieving reports..."
          
          # Create output directory
          mkdir -p security-reports
          
          # Copy reports
          if kubectl -n demo-turbo-instana-concert cp $POD_NAME:/zap/wrk/full-scan-report.html ./security-reports/concert-security-scan.html 2>/dev/null; then
            echo "✓ HTML report retrieved"
            ls -lh ./security-reports/concert-security-scan.html
          else
            echo "⚠️  Failed to retrieve HTML report"
          fi
          
          if kubectl -n demo-turbo-instana-concert cp $POD_NAME:/zap/wrk/full-scan-report.json ./security-reports/concert-security-scan.json 2>/dev/null; then
            echo "✓ JSON report retrieved"
            ls -lh ./security-reports/concert-security-scan.json
          else
            echo "⚠️  Failed to retrieve JSON report"
          fi
          
          echo ""
          echo "📋 Next Steps:"
          echo "1. Download the security reports from the workflow artifacts"
          echo "2. Upload to IBM Concert:"
          echo "   - Navigate to Concert > Vulnerability > Upload exposure"
          echo "   - Scan Source: ZAP"
          echo "   - Environment: kubernetes_demo-turbo-instana-concert_production"
          echo "   - Access Point: concert.lab.allwaysbeginner.com"
          echo "   - Upload the JSON or HTML report"
        continue-on-error: true
      
      # Step: Upload ZAP Results to Concert
      - name: Upload ZAP Results to Concert
        if: secrets.CONCERT_URL != ''
        continue-on-error: true
        env:
          CONCERT_URL: ${{ secrets.CONCERT_URL }}
          CONCERT_API_KEY: ${{ secrets.CONCERT_API_KEY }}
          CONCERT_INSTANCE_ID: ${{ secrets.CONCERT_INSTANCE_ID }}
        run: |
          echo "============================================"
          echo "Uploading ZAP DAST Results to Concert"
          echo "============================================"
          echo "Application: demo-turbo-instana-concert"
          echo "Concert URL: ${CONCERT_URL}"
          echo ""
          
          # Check if ZAP report exists
          ZAP_REPORT=""
          
          if [ -f "./security-reports/concert-security-scan.json" ]; then
            ZAP_REPORT="./security-reports/concert-security-scan.json"
            echo "✓ Found ZAP JSON report: $ZAP_REPORT"
          elif [ -f "./security-reports/concert-security-scan.html" ]; then
            ZAP_REPORT="./security-reports/concert-security-scan.html"
            echo "✓ Found ZAP HTML report: $ZAP_REPORT"
          else
            echo "⚠️  No ZAP scan reports found"
            echo "Checked locations:"
            echo "  - ./security-reports/concert-security-scan.json"
            echo "  - ./security-reports/concert-security-scan.html"
            echo ""
            echo "ZAP scan may still be running or failed to complete."
            echo "Skipping upload (non-blocking)..."
            exit 0
          fi
          
          # Verify file is not empty
          if [ ! -s "$ZAP_REPORT" ]; then
            echo "⚠️  ZAP report file is empty, skipping upload"
            exit 0
          fi
          
          # Show file info
          echo ""
          echo "Report Details:"
          FILE_SIZE=$(ls -lh "$ZAP_REPORT" | awk '{print $5}')
          echo "  File: $ZAP_REPORT"
          echo "  Size: $FILE_SIZE"
          
          # Validate JSON format if it's a JSON file
          if [[ "$ZAP_REPORT" == *.json ]]; then
            echo ""
            echo "Validating JSON format..."
            if command -v jq &> /dev/null; then
              if jq empty "$ZAP_REPORT" 2>/dev/null; then
                echo "✓ JSON file is valid"
              else
                echo "⚠️  JSON file is not valid, skipping upload"
                exit 0
              fi
            else
              echo "⚠️  jq not available, skipping validation"
            fi
          fi
          
          # Upload ZAP results to Concert using Ingestion API
          echo ""
          echo "Uploading DAST results to Concert..."
          echo "Using Concert Ingestion API: ${CONCERT_URL}/ingestion/api/v1/upload_files"
          
          # Get repository info from Gitea context
          REPO_URL="${{ gitea.server_url }}/${{ gitea.repository }}"
          REPO_NAME="${{ gitea.repository }}"
          
          # Determine file extension for upload
          FILE_EXT="${ZAP_REPORT##*.}"
          
          # Use silent mode and only capture HTTP code
          # Use data_type=dynamic_code_scan (correct type for DAST/ZAP scans)
          HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/concert-zap-response.json \
            -X POST "${CONCERT_URL}/ingestion/api/v1/upload_files" \
            -H "accept: application/json" \
            -H "Content-Type: multipart/form-data" \
            -H "InstanceID: ${CONCERT_INSTANCE_ID}" \
            -H "Authorization: C_API_KEY ${CONCERT_API_KEY}" \
            -F "data_type=dynamic_code_scan" \
            -F "filename=@${ZAP_REPORT}" \
            -F "metadata={\"env_name\":\"prod\",\"repo_url\":\"${REPO_URL}\",\"repo_name\":\"${REPO_NAME}\",\"tool\":\"zap\",\"format\":\"${FILE_EXT}\",\"scan_type\":\"dast\",\"access_point\":\"concert.lab.allwaysbeginner.com\"}" \
            --connect-timeout 10 \
            --max-time 60)
          
          echo "HTTP Response Code: ${HTTP_CODE}"
          echo ""
          
          # Check response
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "202" ]; then
            echo "✅ SUCCESS: ZAP scan results uploaded to Concert"
            echo ""
            echo "Response:"
            if [ -f /tmp/concert-zap-response.json ]; then
              cat /tmp/concert-zap-response.json | jq '.' 2>/dev/null || cat /tmp/concert-zap-response.json
            fi
            echo ""
            echo "View results in Concert:"
            echo "  ${CONCERT_URL}/applications/demo-turbo-instana-concert"
          elif [ "$HTTP_CODE" = "401" ]; then
            echo "❌ FAILED: Authentication error (401 Unauthorized)"
            echo "Please verify CONCERT_API_KEY and CONCERT_INSTANCE_ID secrets"
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "❌ FAILED: Application not found (404 Not Found)"
            echo "Please ensure 'demo-turbo-instana-concert' application exists in Concert"
          elif [ "$HTTP_CODE" = "413" ]; then
            echo "❌ FAILED: File too large (413 Payload Too Large)"
            echo "ZAP report size: $FILE_SIZE"
            echo "Consider reducing scan scope or using compressed format"
          else
            echo "⚠️  WARNING: Unexpected response code: ${HTTP_CODE}"
            echo ""
            echo "Response:"
            if [ -f /tmp/concert-zap-response.json ]; then
              cat /tmp/concert-zap-response.json
            fi
          fi
          
          echo ""
          echo "============================================"
      
      - name: Upload ZAP Reports as Artifacts
        if: always()
        run: |
          echo "Checking for ZAP scan reports to upload as artifacts..."
          
          if [ -d "security-reports" ] && [ "$(ls -A security-reports 2>/dev/null)" ]; then
            echo "✓ Security reports found:"
            ls -lh security-reports/
            echo ""
            echo "Reports will be available as workflow artifacts"
          else
            echo "ℹ️  No security reports available yet. Scan may still be running."
            echo "   Run './scripts/run-zap-scan.sh' manually to retrieve reports later."
          fi
        continue-on-error: true


